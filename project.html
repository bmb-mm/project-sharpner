<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Bootstrap CSS -->
  <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">Expense Tracker</h2>
      
      <!-- Expense Form -->
      <form id="expenseForm" class="row g-3">
        <div class="col-md-4">
          <label for="amount" class="form-label">Choose Expense Amount</label>
          <input type="number" class="form-control" id="amount" required>
        </div>
        
        <div class="col-md-4">
          <label for="description" class="form-label">Choose Description</label>
          <input type="text" class="form-control" id="description" required>
        </div>
        
        <div class="col-md-4">
          <label for="category" class="form-label">Choose a Category</label>
          <select class="form-select" id="category" required>
            <option value="Fuel">Fuel</option>
            <option value="Food">Food</option>
            <option value="Electricity">Electricity</option>
            <option value="Movie">Movie</option>
          </select>
        </div>
        
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Add Expense</button>
        </div>
      </form>

      <!-- Expense List -->
      <ul id="expenseList" class="list-group mt-4"></ul>
    </div>
  </div>

  <script>
    const form = document.getElementById('expenseForm');
    const expenseList = document.getElementById('expenseList');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const amount = document.getElementById('amount').value;
      const description = document.getElementById('description').value;
      const category = document.getElementById('category').value;

      const expenseObj = { amount, description, category };

      // Save to localStorage using description as the key
      localStorage.setItem(description, JSON.stringify(expenseObj));

      // Display on screen
      showExpenseOnScreen(expenseObj);

      // Clear inputs
      form.reset();
    });

    function showExpenseOnScreen(obj) {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center';
      li.textContent = `${obj.amount} - ${obj.category} - ${obj.description}`;

      const btnGroup = document.createElement('div');

      // Delete Button
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-danger btn-sm me-2';
      deleteBtn.textContent = 'Delete Expense';
      deleteBtn.onclick = () => {
        localStorage.removeItem(obj.description);
        expenseList.removeChild(li);
      };

      // Edit Button
      const editBtn = document.createElement('button');
      editBtn.className = 'btn btn-warning btn-sm';
      editBtn.textContent = 'Edit Expense';
      editBtn.onclick = () => {
        localStorage.removeItem(obj.description);
        expenseList.removeChild(li);
        document.getElementById('amount').value = obj.amount;
        document.getElementById('description').value = obj.description;
        document.getElementById('category').value = obj.category;
      };

      btnGroup.appendChild(deleteBtn);
      btnGroup.appendChild(editBtn);
      li.appendChild(btnGroup);
      expenseList.appendChild(li);
    }
  </script>
</body>
</html>
